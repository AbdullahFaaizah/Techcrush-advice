<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advice App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="index.js" defer></script>
    <link rel="shortcut icon" href="/favicon-32x32.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Manrope", sans-serif;
      }
    </style>
  </head>

  <body
    class="bg-[#1f2632] flex justify-center items-center min-h-screen p-6 sm:p-0"
  >
    <div
      class="bg-[#323a49] w-full max-w-md shadow-lg p-4 flex flex-col justify-center items-center text-center rounded-2xl space-y-4 pb-16 relative"
    >
      <p class="text-[#52ffa8] uppercase text-xs font-semibold" id="id"></p>
      <p
        class="text-gray-200 font-bold text-xl leading-relaxed w-full max-w-xs"
        id="advice"
      ></p>
      <div class="w-full flex justify-center">
        <img
          src="/pattern-divider-desktop.svg"
          alt="desktop-pattern"
          class="hidden md:block"
        />
      </div>
      <div class="w-full flex justify-center">
        <img
          src="/pattern-divider-mobile.svg"
          alt="mobile-pattern"
          class="block md:hidden"
        />
      </div>
      a
      b
      <button
        class="bg-[#52ffa8] p-4 rounded-full absolute -bottom-6 opacity-75 hover:opacity-100"
        id="btn"
      >
        <img src="/icon-dice.svg" alt="dice-img" />
      </button>
    </div>
  </body>
</html>
