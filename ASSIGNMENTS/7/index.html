<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokes Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="index.js" defer></script>
    <link rel="shortcut icon" href="./favicon-32x32.png" type="image/x-icon">
</head>
<body class="bg-teal-100 flex justify-center items-center min-h-screen">
    <div class="bg-white w-full max-w-md shadow-xl text-center p-8 rounded-2xl text-center
    relative">
        <h1 class="text-3xl font-bold text-teal-700 mb-4">
            Joke Generator
        </h1>
        <p class="text-teal-800 text-lg mb-6" id="joke">
            Click the dice for jokes!
        </p>
        <button 
        class="bg-teal-600 text-white p-4 rounded-full absolute -bottom-5 left-1/2 -translate-x-1/2
        opacity-75 hover:opacity-100"
        id="btn">
        <img src="./icon-dice.svg" alt="dice">
        </button>
    </div>
</body>
</html>
